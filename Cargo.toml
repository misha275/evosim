[package]
name = "evosim"
version = "2.8.0"
edition = "2021"
default-run = "evosim"

[dependencies]
macroquad = { version = "0.4", default-features = false }
rand = "0.8"
rand_distr = "0.4"
rand_xoshiro = { version = "0.6", features = ["serde1"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3"
flate2 = "1"
rayon = "1.10"
parking_lot = "0.12"
rustc-hash = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
opt-level = 2
